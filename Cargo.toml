[package]
name = "whale"
version = "0.5.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sha2 = { version = "0.10", features = ["asm"] }
rayon = "1.10"
crossbeam-channel = "0.5"
memmap2 = "0.9"
faster-hex = "0.9"
itoa = "1.0"
libc = "0.2"
rustc-hash = "2.0"
arrow-array = "53.2"
arrow-schema = "53.2"
parquet = { version = "53.2", features = ["arrow", "zstd", "snap", "flate2"] }
deltalake = { version = "0.22", features = ["datafusion"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"